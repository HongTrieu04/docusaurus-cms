backend:
  name: github
  branch: main
  repo: "HongTrieu04/docusaurus-cms"

# Cài đặt media, phần này đã đúng
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# === COLLECTIONS ===
# Chúng ta sẽ định nghĩa TẤT CẢ các collection ở đây
collections:

  # --- 1. BLOG ---
  # Cấu hình cho các bài viết trong thư mục 'blog'
  - name: "blog"
    label: "Bài viết (Blog)"
    folder: "blog"
    create: true
    identifier_field: "title" # Dùng 'title' để hiển thị tên bài viết
    extension: "md"           # Chỉ tìm file .md (hoặc mdx nếu bạn dùng)
    format: "frontmatter"     # Báo CMS là có frontmatter ở đầu file
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Tên file khi tạo mới
    fields:
      - { name: "title", label: "Tiêu đề", widget: "string" }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - label: "Tags"
        name: "tags"
        widget: "list"
        optional: true
      - label: "Tác giả (Authors)"
        name: "authors"
        widget: "list"
        optional: true
        # Cấu hình tác giả phức tạp này đã đúng
        fields:
          - { name: name, label: Name, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: imageUrl, label: ImageURL, widget: string }
      - { name: "body", label: "Nội dung", widget: "markdown" } # Nội dung chính

  # --- 2. DOCS (GỐC) ---
  # Cấu hình cho các file NẰM NGAY TRONG 'docs' (như intro.md)
  - name: "docs_root"
    label: "Tài Liệu (Gốc)"
    folder: "docs"
    create: true
    identifier_field: "title"
    # Quan trọng: Chỉ tìm file .md, BỎ QUA các thư mục con
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}" # Tên file khi tạo mới (không dùng ngày tháng cho docs)
    fields:
      # Đây là các trường QUAN TRỌNG cho Docusaurus
      - { name: "title", label: "Tiêu đề", widget: "string" }
      - { name: "sidebar_label", label: "Nhãn Sidebar", widget: "string", optional: true }
      - { name: "sidebar_position", label: "Vị trí Sidebar", widget: "number", value_type: 'int', optional: true }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }

  # --- 3. DOCS (TUTORIAL BASICS) ---
  # Cấu hình riêng cho thư mục 'docs/tutorial-basics'
  - name: "docs_basics"
    label: "Docs (Tutorial Basics)"
    folder: "docs/tutorial-basics"
    create: true
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      # Chúng ta dùng chung các trường Docusaurus
      - { name: "title", label: "Tiêu đề", widget: "string" }
      - { name: "sidebar_label", label: "Nhãn Sidebar", widget: "string", optional: true }
      - { name: "sidebar_position", label: "Vị trí Sidebar", widget: "number", value_type: 'int', optional: true }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }

  # --- 4. DOCS (TUTORIAL EXTRAS) ---
  # Cấu hình riêng cho thư mục 'docs/tutorial-extras'
  - name: "docs_extras"
    label: "Docs (Tutorial Extras)"
    folder: "docs/tutorial-extras"
    create: true
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      # Chúng ta dùng chung các trường Docusaurus
      - { name: "title", label: "Tiêu đề", widget: "string" }
      - { name: "sidebar_label", label: "Nhãn Sidebar", widget: "string", optional: true }
      - { name: "sidebar_position", label: "Vị trí Sidebar", widget: "number", value_type: 'int', optional: true }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }


