backend:
  name: github
  branch: main
  repo: "HongTrieu04/docusaurus-cms"

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# Custom widgets
publish_mode: editorial_workflow

# Widget registration
widget:
  - name: navbarFolderWidget
    component: ./src/components/NavbarFolderWidget.js

collections:
  - name: "settings"
    label: "Cài Đặt Trang"
    editor:
      preview: false
    files:
      - label: "Thanh Điều Hướng (Navbar)"
        name: "navbar"
        file: "data/navbar.json"
        fields:
          - label: "Các mục trên Navbar"
            name: "items"
            widget: "list"
            fields:
              # === PHẦN SỬA LỖI BẮT BUỘC CỦA BẠN ===
              - { label: "Nhãn (Label)", name: "label", widget: "string" } # Trường này nên bắt buộc
              - { label: "Đường dẫn (to)", name: "to", widget: "string", optional: true, hint: "Dùng cho link nội bộ, ví dụ: /blog hoặc /docs/intro" }
              - { label: "Đường dẫn đầy đủ (href)", name: "href", widget: "string", optional: true, hint: "Dùng cho link bên ngoài, ví dụ: https://google.com" }
              - { label: "Loại (type)", name: "type", widget: "string", optional: true, hint: "Ví dụ: 'docSidebar'" }
              - { label: "Sidebar ID", name: "sidebarId", widget: "string", optional: true, hint: "Chỉ dùng khi Loại là 'docSidebar'" }
              - { label: "Vị trí (position)", name: "position", widget: "select", options: ["left", "right"], default: "left", optional: true }
          - label: "Tự động tạo thư mục"
            name: "auto_create_folders"
            widget: "hidden"
            default: true

# ... (rest of the existing content continues)