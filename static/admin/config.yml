backend:
  name: github
  branch: main
  repo: "HongTrieu04/docusaurus-cms"

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# Custom widgets
publish_mode: editorial_workflow

# Widget registration
widget:
  - name: navbarFolderWidget
    component: ./src/components/NavbarFolderWidget.js

collections:
  - name: "settings"
    label: "Cài Đặt Trang"
    editor:
      preview: false
    files:
      - label: "Thanh Điều Hướng (Navbar)"
        name: "navbar"
        file: "data/navbar.json"
        fields:
          - label: "Các mục trên Navbar"
            name: "items"
            widget: "list"
            fields:
              # === CẤU HÌNH THANH ĐIỀU HƯỚNG ===
              - { label: "Nhãn (Label)", name: "label", widget: "string", hint: "Tên hiển thị trên navbar (bắt buộc)" }
              - { label: "Đường dẫn nội bộ (to)", name: "to", widget: "string", optional: true, hint: "Link nội bộ, ví dụ: /blog, /docs/intro, /about" }
              - { label: "Đường dẫn bên ngoài (href)", name: "href", widget: "string", optional: true, hint: "Link bên ngoài, ví dụ: https://google.com, https://facebook.com" }
              - { label: "Loại mục (type)", name: "type", widget: "string", optional: true, hint: "Chọn loại: 'docSidebar' cho tài liệu, 'external' cho link ngoài, để trống cho link thường" }
              - { label: "ID Sidebar", name: "sidebarId", widget: "string", optional: true, hint: "ID sidebar khi type='docSidebar'. Có sẵn: 'tutorialSidebar'. Xem sidebars.js để biết thêm ID." }
              - { label: "Vị trí (position)", name: "position", widget: "select", options: ["left", "right"], default: "left", optional: true, hint: "Vị trí hiển thị trên navbar" }
          - label: "Tự động tạo thư mục"
            name: "auto_create_folders"
            widget: "hidden"
            default: true

# ... (rest of the existing content continues)