backend:
  name: github
  branch: main
  repo: "HongTrieu04/docusaurus-cms"
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: mydocusaurus-cms.netlify.app

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# === COLLECTIONS ===
collections:
  # --- 1. BLOG ---
  - name: "blog"
    label: "Bài viết (Blog)"
    folder: "blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "Tiêu đề", widget: "string", optional: true }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }

  # --- 2. DOCS (Tự động quét nội dung bên trong) ---
  - name: "docs"
    label: "Tài Liệu (Docs)"
    folder: "docs"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    # 'nested' BẬT tính năng "tự động quét thư mục con"
    # Đây là cách CMS quét NỘI DUNG, không phải quét COLLECTIONS
    nested:
      depth: 5 
    fields:
      - { name: "title", label: "Tiêu đề (Title)", widget: "string", optional: true }
      - { name: "sidebar_label", label: "Nhãn Sidebar", widget: "string", optional: true }
      - { name: "sidebar_position", label: "Vị trí Sidebar", widget: "number", value_type: 'int', optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }

  # --- 3. CÀI ĐẶT TRANG (Sửa Navbar) ---
  - name: "settings"
    label: "Cài Đặt Trang"
    editor:
      preview: false
    files:
      - label: "Thanh Điều Hướng (Navbar)"
        name: "navbar"
        file: "data/navbar.json" # Trỏ đến file dữ liệu
        fields:
          - label: "Các mục trên Navbar"
            name: "items"
            widget: "list"
            fields:
              # === Navbar Item Configuration ===
              - {
                  label: "Nhãn (Label)",
                  name: "label",
                  widget: "string",
                  hint: "Tên hiển thị (bắt buộc)"
                }
              - {
                  label: "Loại liên kết",
                  name: "linkType",
                  widget: "select",
                  options: [
                    { label: "Liên kết nội bộ", value: "internal" },
                    { label: "Liên kết ngoài", value: "external" },
                    { label: "Sidebar tài liệu", value: "docSidebar" }
                  ],
                  default: "internal",
                  hint: "Chọn loại liên kết cho mục này"
                }
              - {
                  label: "Đường dẫn nội bộ (to)",
                  name: "to",
                  widget: "string",
                  required: false,
                  hint: "Đường dẫn nội bộ (vd: /docs/intro, /blog)",
                  pattern: ['^\/.*', 'Phải bắt đầu bằng dấu /'],
                  condition: {
                    field: "linkType",
                    value: "internal"
                  }
                }
              - {
                  label: "Đường dẫn bên ngoài (href)",
                  name: "href",
                  widget: "string",
                  required: false,
                  hint: "Đường dẫn đầy đủ (vd: https://google.com)",
                  pattern: ['^https?:\/\/.*', 'Phải bắt đầu bằng http:// hoặc https://'],
                  condition: {
                    field: "linkType",
                    value: "external"
                  }
                }
              - {
                  label: "ID Sidebar",
                  name: "sidebarId",
                  widget: "select",
                  options: ["tutorialSidebar", "docs", "blog"],
                  default: "tutorialSidebar",
                  required: false,
                  hint: "Chọn ID của sidebar muốn hiển thị",
                  condition: {
                    field: "linkType",
                    value: "docSidebar"
                  }
                }
              - {
                  label: "Tạo thư mục",
                  name: "createFolder",
                  widget: "navbarFolderWidget",
                  required: false,
                  hint: "Nhấn để tạo/cập nhật cấu trúc thư mục tương ứng",
                  condition: {
                    field: "linkType",
                    value: "internal"
                  }
                }
              - {
                  label: "Vị trí hiển thị",
                  name: "position",
                  widget: "select",
                  options: [
                    { label: "Bên trái", value: "left" },
                    { label: "Bên phải", value: "right" }
                  ],
                  default: "left",
                  required: false,
                  hint: "Vị trí hiển thị trên thanh điều hướng"
                }