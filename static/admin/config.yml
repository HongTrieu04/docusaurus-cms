backend:
  name: github
  branch: main
  repo: "HongTrieu04/docusaurus-cms"

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# === COLLECTIONS ===
collections:
  # --- 1. BLOG ---
  # Collection này có vẻ đã ổn, giữ nguyên
  - name: "blog"
    label: "Bài viết (Blog)"
    folder: "blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "title", label: "Tiêu đề", widget: "string" }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - label: "Tags"
        name: "tags"
        widget: "list"
        optional: true
      - label: "Tác giả (Authors)"
        name: "authors"
        widget: "list"
        optional: true
        fields:
          - { name: name, label: Name, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: imageUrl, label: ImageURL, widget: string }
      - { name: "body", label: "Nội dung", widget: "markdown" }

  # --- 2. DOCS (Đã gộp và dùng 'nested') ---
  # Đây là collection duy nhất cho TẤT CẢ các tài liệu
  - name: "docs"
    label: "Tài Liệu (Docs)"
    folder: "docs"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}" # Tên file khi tạo mới
    
    # === PHẦN GIẢI QUYẾT VẤN ĐỀ 1 & 2 ===
    # Bật tính năng lồng nhau, CMS sẽ tự quét thư mục con
    nested:
      depth: 5 # Cho phép quét sâu 5 cấp thư mục, bạn có thể tăng lên
      
    # === PHẦN GIẢI QUYẾT VẤN ĐỀ 3 ===
    # Không dùng 'identifier_field: title' nữa
    # CMS sẽ tự động dùng tên file làm tên hiển thị, không bao giờ bị trống
    
    # Các trường này sẽ áp dụng cho TẤT CẢ các file docs
    fields:
      - { name: "title", label: "Tiêu đề (Title)", widget: "string", optional: true }
      - { name: "sidebar_label", label: "Nhãn Sidebar", widget: "string", optional: true }
      - { name: "sidebar_position", label: "Vị trí Sidebar", widget: "number", value_type: 'int', optional: true }
      - { name: "slug", label: "Slug (Đường dẫn)", widget: "string", optional: true }
      - { name: "body", label: "Nội dung", widget: "markdown" }

      
